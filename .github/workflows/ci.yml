name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @apimigrate/core -w @apimigrate/cli -w @apimigrate/action -w @apimigrate/ingester
      - run: npm run test -w @apimigrate/core -w @apimigrate/cli -w @apimigrate/action -w @apimigrate/ingester -w @apimigrate/server
